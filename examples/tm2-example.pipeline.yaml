# ─────────────────────────────────────────────────────────────────────────────
# Sluice pipeline config — Eribe customer migration
# @caracal-lynx/sluice
#
# Usage:
#   sluice check    tm2-example.pipeline.yaml   validate config only
#   sluice validate tm2-example.pipeline.yaml   DQ + transform, no load
#   sluice run      tm2-example.pipeline.yaml   full migration
#
# Connection strings live in .env (never commit this file with real credentials).
# ─────────────────────────────────────────────────────────────────────────────

pipeline:
  name: eribe-style-master
  client: eribe 
  version: "1.0"
  entity: style
  description: Style master migration — legacy TCMACS to BlueCherry


# ── EXTRACT ───────────────────────────────────────────────────────────────────
source:
  adapter: mssql                   # mssql | pg | csv | xlsx | rest
  connection: ${TM2_MSSQL}         # resolved from .env at runtime
  query: |
    SELECT
      p.REFERENCE, p.NAME, p.SEASON, p.DETAIL
    FROM dbo.ProHead p
    


# ── DATA QUALITY ──────────────────────────────────────────────────────────────
dq:
  stopOnCritical: true
  rejectionFile: ./output/eribe-style-master-rejected.csv

  rules:
    - field: REFERENCE
      checks:
        - { type: notNull,   severity: warning }

    - field: NAME
      checks:
        - { type: notNull,   severity: warning }

    - field: SEASON
      checks:
        - { type: notNull,   severity: warning }

    - field: DETAIL
      checks:
        - { type: notNull,   severity: warning }


# ── TRANSFORM ─────────────────────────────────────────────────────────────────
transform:
  
  fields:
    - { to:   Division,                         type: constant,        value: 'FG' }
    - { from: REFERENCE,      to: Style,        type: string,          max: 12 }
    - { to:   Colour Code,                      type: constant,        value: 'Test Colour Code' }
    - { to:   Label,                            type: constant,        value: 'Test Label' }
    - { to:   Dimen/Pack,                       type: constant,        value: 'Test Dimen/Pack' }   
    - { from: SEASON,         to: Season,       type: string,          max: 5 }
    - { from: NAME,           to: Style Name,   type: expression,      value: "js: String(row.NAME ?? '').replace(/\\s+/g, ' ').trim().substring(0, 60)" }


# ── LOAD ──────────────────────────────────────────────────────────────────────
target:
  adapter: csv
  entity: style-master
  output: ./output/eribe-style-master.csv
  includeHeader: true
  columnOrder:
    - Division
    - Style
    - Colour Code
    - Label
    - Dimen/Pack
    - Season
    - Style Name


# ── EXECUTION ─────────────────────────────────────────────────────────────────
run:
  mode: full
  batchSize: 500
  onError: continue
  logLevel: info
  dryRun: false
