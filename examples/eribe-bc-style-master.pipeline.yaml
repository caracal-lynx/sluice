# Eribe Knitwear — BlueCherry Style Master (ZZXSTYLR) pipeline scaffold
#
# Generated from:
#   blueCherry-etl-specifications/Style Master Field Details.xlsx
#
# STATUS: scaffolded. The `source`, `dq`, and all `from:` values are
# TODO placeholders. Replace TODO_* tokens with real source column names
# once the legacy Eribe source schema is known.
#
# Notes:
#   - Four fields appear twice in the spec (once header-band, once detail-band):
#       Carton Weight / Carton Quantity / Style Weight / Style Volume
#     The duplicates are suffixed `*Dtl`. Verify this matches the BlueCherry
#     import template before running a live migration.
#   - Check-box fields (Char(1) Y/N) are modelled as `type: string, max: 1`
#     rather than `type: boolean`, because BlueCherry expects literal 'Y'/'N'.
#   - Fields whose help-text says 'Always y (Yes)' are emitted as constants.

pipeline:
  name: eribe-bc-style-master
  client: eribe-knitwear
  version: "0.1"
  entity: Style
  description: Eribe style master migration to BlueCherry ERP (ZZXSTYLR import).

source:
  # TODO: replace with real source adapter (mssql / csv / xlsx)
  adapter: mssql
  connection: ${TM2_MSSQL}         # resolved from .env at runtime
  query: |
    SELECT
      p.REFERENCE, p.NAME, p.SEASON, p.DETAIL
    FROM dbo.ProHead p

dq:
  stopOnCritical: true
  rejectionFile: ./output/eribe-bc-style-master-rejected.csv
  rules: []    # TODO: add notNull/unique/maxLength rules once source columns are known

