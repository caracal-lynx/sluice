# Example: Multi-source merge — Style Co style master data
#
# This pipeline demonstrates merging style master data from two sources:
# 1. IFS ERP (priority 1) — authoritative master data
# 2. Excel supplement (priority 2) — enrichment data and corrections
#
# Strategy: coalesce
#   - Uses first non-null value by priority
#   - Fills gaps where ERP data is sparse
#   - Respects field-level overrides (e.g., cost always from IFS)
#
# Usage:
#   sluice check examples/style-co-style-merge.pipeline.yaml
#   sluice run   examples/style-co-style-merge.pipeline.yaml
#
# `check` validates the config. It resolves ${IFS_CONNECTION} and
# ${PG_CONNECTION} first, so set both (dummy values are fine for `check`).
# `run` needs a reachable IFS database, a Postgres target, and the enrichment
# workbook at ./data/style-co-style-enrichment.xlsx, which is not shipped.

pipeline:
  name: style-co-style-merge
  client: style-co
  version: "1.0.0"
  entity: style
  description: |
    Merge Style Co internal style master (IFS) with Excel enrichment,
    coalesce by priority, validate, then prepare for sync.

# ───── Multi-source block ─────────────────────────────────────────

sources:
  # Source 1: IFS ERP — Primary source (priority 1 = checked first)
  - id: ifs-master
    priority: 1
    adapter: mssql
    connection: ${IFS_CONNECTION} # env var: mssql://user:pass@host:port/ifs
    query: |
      SELECT
        StyleNo         AS style_no,
        Description     AS description,
        ColourCode      AS colour_code,
        SeasonCode      AS season_code,
        UnitCost        AS unit_cost,
        TargetRetail    AS target_retail,
        LaunchDate      AS launch_date,
        NULL            AS sustainability_notes,
        NULL            AS best_price_vendor,
        'IFS'           AS record_origin -- marker: non-null only where IFS has the style
      FROM StyleMaster
      WHERE IsActive = 1

  # Source 2: Excel enrichment — Secondary source (priority 2)
  - id: excel-enrichment
    priority: 2
    adapter: xlsx
    file: ./data/style-co-style-enrichment.xlsx
    sheet: "Style Enrichment"
    rename:
      "STYLE_NO": "style_no"
      "Colour Code": "colour_code"
      "Season": "season_code"
      "Best Price Vendor": "best_price_vendor"
      "Sustainability Notes": "sustainability_notes"
      "Description": "description"
      "Cost": "unit_cost"
      "Retail": "target_retail"
      "Launch": "launch_date"

# ───── Merge configuration ─────────────────────────────────────────

merge:
  key: style_no # Join on style number

  strategy: coalesce # Coalesce (first non-null by priority)
  # strategy: union              # Alt: include all rows from both sources
  # strategy: intersect          # Alt: only styles present in both

  onUnmatched:
    include # Include unmatched styles; warn if found
    # warn                        # Same as above; explicit logging
    # exclude                     # Drop rows only in one source (inner join)
    # error                       # Fail pipeline if any unmatched rows

  # Field-level strategy overrides
  fieldStrategies:
    # Always trust IFS for cost (business rule). A style that exists only in
    # the Excel sheet therefore has no cost, fails the critical notNull rule on
    # unit_cost below, and stops the run: cost must come from the ERP.
    - field: unit_cost
      source: ifs-master

    # Always trust IFS for launch date
    - field: launch_date
      source: ifs-master

    # For description, the highest-priority source that HAS the style wins,
    # even when its value is blank: IFS's description is kept as-is, and Excel
    # only supplies one for styles IFS doesn't have. (Plain coalesce would let
    # Excel fill a blank IFS description instead.)
    - field: description
      strategy: priority-override

  # Log conflicting values (rows where sources differ)
  conflictLog: ./logs/style-merge-conflicts.csv

# ───── Data quality ─────────────────────────────────────────────

dq:
  stopOnCritical: true
  rejectionFile: ./logs/merged-styles-rejected.csv

  rules:
    # Style number format (from shared rules)
    - field: style_no
      sourceId: ifs-master # Only validate where ERP is source
      checks:
        - type: notNull
          severity: critical
        - type: pattern
          value: "^[A-Z]{2}[0-9]{4}$"
          severity: critical
          message: "Expected format: XX#### (e.g., AC0123)"

    # Colour code format
    - field: colour_code
      checks:
        - type: notNull
          severity: critical
        - type: pattern
          value: "^[0-9]{3}$"
          severity: critical

    # Season code
    - field: season_code
      checks:
        - type: pattern
          value: "^(SS|AW)[0-9]{2}$"
          severity: warning
          message: "Expected SS## or AW## (e.g., SS25)"

    # Cost is numeric and positive
    - field: unit_cost
      checks:
        - type: notNull
          severity: critical
        - type: min
          value: 0.01
          severity: warning

    # Retail is numeric and positive
    - field: target_retail
      checks:
        - type: min
          value: 0
          severity: info

# ───── Transform ─────────────────────────────────────────────────
#
# Each field maps a merged column (`from`) to an output column (`to`).
# `expression` fields take their expression in `value`: plain expr-eval by
# default, or JavaScript with the `js:` prefix (see the transforms reference).

transform:
  fields:
    # Key columns
    - { from: style_no, to: style_no, type: string }
    - { from: colour_code, to: colour_code, type: string }
    - { from: season_code, to: season_code, type: string }

    # Enriched columns
    - { from: description, to: description, type: string }
    - { from: unit_cost, to: unit_cost, type: decimal, precision: 2 }
    - { from: target_retail, to: target_retail, type: decimal, precision: 2 }
    - { from: launch_date, to: launch_date, type: date }
    - { from: sustainability_notes, to: sustainability_notes, type: string, optional: true }
    - { from: best_price_vendor, to: best_price_vendor, type: string, optional: true }

    # Derived: retail margin %, to 1 decimal place; null unless both prices are
    # positive. Uses `js:` because expr-eval has no `null` literal.
    - to: margin_pct
      type: expression
      value: >-
        js: row.unit_cost > 0 && row.target_retail > 0
        ? Math.round(((row.target_retail - row.unit_cost) / row.target_retail) * 1000) / 10
        : null

    # Audit columns
    - { to: merged_at, type: constant, value: "2026-04-15" }

    # 'IFS' where the style came from IFS (the query's record_origin marker),
    # otherwise 'Excel'. The merged row carries no per-source flag of its own.
    - { from: record_origin, to: merge_source, type: string, default: Excel }

# ───── Target ────────────────────────────────────────────────────

target:
  adapter: pg
  connection: ${PG_CONNECTION} # env var: postgresql://user:pass@host/sluice
  table: stg_style_co_style_merged
  # Re-runnable: update existing styles in place. Needs a unique constraint
  # on style_no in the target table.
  onConflict: upsert
  upsertKey: [style_no]

# ───── Runtime options ────────────────────────────────────────────

run:
  mode: full # full | incremental | validate-only
