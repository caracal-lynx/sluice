# Lefthook hooks for Sluice. https://lefthook.dev/configuration/
#
# Activated by `lefthook install`, which is wired into the package.json
# `prepare` script so a fresh `pnpm install` is enough. CI is naturally exempt
# (GitHub Actions doesn't `git commit`); local emergency skip is
# `LEFTHOOK=0 git commit ...` or `git commit --no-verify`.

pre-commit:
  parallel: true
  jobs:
    - name: block-private-context
      run: pwsh -NoProfile -File scripts/check-no-private-context.ps1 {staged_files}

    - name: format
      glob: '*.{ts,js,mjs,cjs,md,json,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts,js,mjs,cjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
