name: Feature request
description: Suggest a new feature, plugin, or YAML option for Sluice
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before filing, please:

        - Check whether the feature already exists as a Tier 2 / Tier 3 plugin in the [PLUGINS.md](../../blob/master/PLUGINS.md) docs
        - Check existing issues for similar requests
        - For commercial features (paid enrich providers, ERP adapters, MCP server, etc.) email **sluice@caracallynx.com** rather than filing here

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: |
        What problem are you trying to solve? Describe the migration scenario,
        the data shape, and what's awkward or impossible to express today.
    validations:
      required: true

  - type: textarea
    id: proposed-shape
    attributes:
      label: Proposed YAML / API shape
      description: |
        Sketch what the YAML config or API call would look like if the feature
        existed. Doesn't need to be final — it just helps anchor the discussion.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        What workarounds have you tried? (Custom plugin? Extra transform step?
        Pre-processing the source data?) Why aren't they sufficient?
    validations:
      required: false

  - type: dropdown
    id: pr-willingness
    attributes:
      label: Would you be willing to send a PR?
      description: No pressure — useful for prioritisation.
      options:
        - "Yes, I'd like to implement this"
        - "Yes, with guidance"
        - "No, just suggesting"
    validations:
      required: true

  - type: textarea
    id: extra-context
    attributes:
      label: Extra context
      description: Links to similar features in other tools, related issues, etc.
    validations:
      required: false
