name: Bug report
description: Report a bug in the Sluice CLI, engine, or built-in adapters
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Before submitting, please:

        - Check existing issues to avoid duplicates
        - Read the [Licensing FAQ](../../blob/master/docs/licensing-faq.md) if your question is about commercial use
        - For security vulnerabilities, **do not** file a public issue — see [SECURITY.md](../../blob/master/SECURITY.md)

  - type: input
    id: sluice-version
    attributes:
      label: Sluice version
      description: Output of `sluice --version` or the value of `@caracal-lynx/sluice` in your `package.json`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v24.x.x"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - CI runner (specify in the description)
    validations:
      required: true

  - type: textarea
    id: yaml-excerpt
    attributes:
      label: Pipeline YAML (smallest reproducer)
      description: |
        Paste the smallest pipeline YAML that reproduces the issue. Strip out any
        client-specific column or table names. If credentials are referenced via
        `${ENV_VAR}` tokens, leave the tokens — never paste real credentials.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you think would happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include relevant log output (set `--log-level debug` if helpful) and any rejection CSV / DQ summary content.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra-context
    attributes:
      label: Extra context
      description: Anything else that might help — DuckDB version, source database flavour, ERP target, plugins loaded, etc.
    validations:
      required: false
