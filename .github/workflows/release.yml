name: Release

# Consumes the org-wide reusable Node release workflow defined in
# caracal-lynx/.github/.github/workflows/node-release.yml. Implements the
# Changesets PR-flow + npm Trusted Publishing (OIDC). The previous
# hand-rolled release pipeline is the source of the central workflow's shape.
# See DAG-73 for the migration rationale.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions must be declared in the caller — the called node-release.yml
# can only request permissions the caller has granted. See its own
# permissions block for the rationale on each.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # @v1.11.0 adds the opt-in Linear release sync (sync-linear, DAG-74); it also
    # carries (since @v1.9.0) the DAG-162 install-auth fix — node-release passes
    # NPM_READ_TOKEN to the install step unconditionally, so restricted
    # @caracal-lynx/* deps (the shared eslint-config) resolve with just
    # secrets: inherit (the old per-repo `npm-read-auth: true` is a no-op) — and
    # SHA-pinned third-party actions (DAG-78).
    uses: caracal-lynx/.github/.github/workflows/node-release.yml@v1.11.0
    with:
      node-version: "24.16.0"
      package-manager: pnpm
      # Sync each npm publish to the "Sluice" continuous pipeline in Linear,
      # creating a completed release with the issues referenced in the commit
      # range / PR descriptions. Only fires on an actual publish. See DAG-74.
      sync-linear: true
    secrets: inherit # also provides LINEAR_ACCESS_KEY (org secret) to the Linear step
