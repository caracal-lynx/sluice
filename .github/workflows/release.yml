name: Release

# Consumes the org-wide reusable Node release workflow defined in
# caracal-lynx/.github/.github/workflows/node-release.yml. Implements the
# Changesets PR-flow + npm Trusted Publishing (OIDC). The previous
# hand-rolled release pipeline is the source of the central workflow's shape.
# See DAG-73 for the migration rationale.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions must be declared in the caller — the called node-release.yml
# can only request permissions the caller has granted. See its own
# permissions block for the rationale on each.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: caracal-lynx/.github/.github/workflows/node-release.yml@v1.6.0
    with:
      node-version: "24.16.0"
      package-manager: pnpm
      # Read auth for restricted @caracal-lynx/* deps (the shared eslint-config
      # is a devDependency). Without it the release install 404s on the private
      # package via pnpm's minimumReleaseAge check. node-release defaults this
      # to false; node-ci enables it, which is why CI passed but release did not.
      npm-read-auth: true
    secrets: inherit
