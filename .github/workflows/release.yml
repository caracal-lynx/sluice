name: Release

# Consumes the org-wide reusable Node release workflow defined in
# caracal-lynx/.github/.github/workflows/node-release.yml. Implements the
# Changesets PR-flow + npm Trusted Publishing (OIDC). The previous
# hand-rolled release pipeline is the source of the central workflow's shape.
# See DAG-73 for the migration rationale.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions must be declared in the caller — the called node-release.yml
# can only request permissions the caller has granted. See its own
# permissions block for the rationale on each.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # @v1.9.0 fixes the install-step auth gap (DAG-162): node-release now passes
    # NPM_READ_TOKEN to the install step unconditionally, so restricted
    # @caracal-lynx/* deps (the shared eslint-config) resolve with just
    # secrets: inherit. The old per-repo `npm-read-auth: true` is now a no-op.
    uses: caracal-lynx/.github/.github/workflows/node-release.yml@v1.9.0
    with:
      node-version: "24.16.0"
      package-manager: pnpm
    secrets: inherit
