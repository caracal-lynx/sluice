name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          commit: '[master] - chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Authentication via npm Trusted Publishing (OIDC).
          # NO NPM_TOKEN — Classic Automation tokens were retired in Nov 2025;
          # Trusted Publishing is now the recommended path for CI publishing.
          # The package's Trusted Publishers list (configured at
          # npmjs.com/package/@caracal-lynx/sluice/access) authorises this
          # workflow by org + repo + filename, and `id-token: write` provides
          # the OIDC token at publish time.
