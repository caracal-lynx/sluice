name: CI — tsgo experiment

# Standalone non-blocking workflow that runs the experimental Go-based
# TypeScript compiler (tsgo / @typescript/native-preview) in parallel
# with the main CI. Provides early warning if tsgo would fail to type-check
# Sluice, ahead of the planned TypeScript 7 / tsgo upgrade (DAG-71).
#
# This is intentionally separate from the central node-ci.yml so that the
# central workflow stays simple and consumer-focused; tsgo is a Sluice-only
# experiment for now. Drop this file (and the typecheck:tsgo script) once
# TypeScript 7 ships and tsgo becomes the default typecheck.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-tsgo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-tsgo:
    name: Typecheck (tsgo)
    runs-on: ubuntu-latest
    continue-on-error: true   # tsgo failures don't block merge — they signal future risk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:tsgo
