name: CI

# Consumes the org-wide reusable Node CI workflow defined in
# caracal-lynx/.github/.github/workflows/node-ci.yml. Hand-rolled CI
# previously lived here; see DAG-73 for the migration rationale.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: caracal-lynx/.github/.github/workflows/node-ci.yml@v1.6.0
    with:
      node-version: "24.16.0"
      # Single-OS for now — Windows matrix is a deliberate follow-up; today's
      # Sluice CI has never run on Windows so adding it here would conflate
      # the pilot migration with a behaviour change.
      os-matrix: '["ubuntu-latest"]'
      package-manager: pnpm
      coverage: true
      # PUB-06: every src/ change needs a changeset. The bespoke job that used to
      # live here (DAG-76 prototype) is now centralised in node-ci.yml (DAG-63)
      # and folded into the single ci / CI success check.
      require-changeset: true
    secrets: inherit
