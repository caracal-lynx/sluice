name: CI

# Consumes the org-wide reusable Node CI workflow defined in
# caracal-lynx/.github/.github/workflows/node-ci.yml. Hand-rolled CI
# previously lived here; see DAG-73 for the migration rationale.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: caracal-lynx/.github/.github/workflows/node-ci.yml@v1.11.0
    with:
      node-version: "24.16.0"
      # Cross-platform matrix — Sluice MUST run on Windows PowerShell 7 as well as
      # in CI (CLAUDE.md non-negotiable), so both OSes gate every change (DAG-79).
      # The whole suite passes on Windows (DuckDB win32 binding loads, paths use
      # path.join). The `ci / CI success` aggregator already gates both legs.
      os-matrix: '["ubuntu-latest", "windows-latest"]'
      package-manager: pnpm
      coverage: true
      # PUB-06: every src/ change needs a changeset. The bespoke job that used to
      # live here (DAG-76 prototype) is now centralised in node-ci.yml (DAG-63)
      # and folded into the single ci / CI success check.
      require-changeset: true
    secrets: inherit
