name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - "src/config/schema.ts"
      - "CHANGELOG.md"
      - "PLUGINS.md"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "src/config/schema.ts"
      - "CHANGELOG.md"
      - "PLUGINS.md"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs —
# we want the latest commit to be reflected on the live site, not skipped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # One workspace install covers both the root package and docs-site, so
      # docs-site/scripts/generate-schema-reference.ts can resolve `zod` from
      # src/config/schema.ts at the repo root. Build scripts are gated by
      # pnpm.onlyBuiltDependencies in the root package.json.
      #
      # NODE_AUTH_TOKEN: the root devDeps include the restricted
      # @caracal-lynx/eslint-config, so --frozen-lockfile's minimumReleaseAge
      # check 404s unauthenticated (DAG-162, same class as ci-tsgo.yml #216).
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Build site (runs prebuild = sync changelog + generate schema reference)
        run: pnpm --filter docs-site build

      - name: Configure Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
