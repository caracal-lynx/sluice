name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - 'src/config/schema.ts'
      - 'CHANGELOG.md'
      - 'PLUGINS.md'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'src/config/schema.ts'
      - 'CHANGELOG.md'
      - 'PLUGINS.md'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs —
# we want the latest commit to be reflected on the live site, not skipped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          # Cache against both lockfiles — the parent install is needed so
          # docs-site/scripts/generate-schema-reference.ts can resolve `zod`
          # from src/config/schema.ts at the repo root.
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json

      - name: Install root dependencies (zod for schema generator)
        run: npm ci --ignore-scripts

      - name: Install docs-site dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build site (runs prebuild = sync changelog + generate schema reference)
        run: npm run build
        working-directory: docs-site

      - name: Configure Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
