# pnpm workspace. The repo root (@caracal-lynx/sluice) is the published
# package; docs-site is the Astro docs build. One pnpm-lock.yaml covers both.
#
# Settings live here (not package.json) since pnpm 11: the `pnpm` field in
# package.json is no longer read — `overrides` and build-script allowlisting
# moved to this file. See https://pnpm.io/settings. Only the workspace-root
# file is honoured, so docs-site's `devalue` override lives here too.
#
# The repo root ('.') must be listed so Changesets discovers @caracal-lynx/sluice
# (the published package) — without it, `changeset status`/`version` error with
# "package ... not in the workspace" and both the changeset-required CI gate and
# the release flow break (DAG-48).
packages:
  - "."
  - "docs-site"

# Transitive-vuln pins (see CLAUDE.md for the advisory behind each). Renovate
# does not manage these — drop each when its parent ships a patched release.
overrides:
  tmp: ">=0.2.7"
  devalue: ">=5.8.1"
  uuid: ">=11.1.1"
  esbuild: ">=0.28.1"
  brace-expansion: ">=5.0.8"

# Build-script allowlist (pnpm 11's `allowBuilds`, formerly
# `onlyBuiltDependencies`). pnpm does not run dependency build scripts unless
# listed here. `@duckdb/node-api` is deliberately absent — it ships prebuilt
# binaries as optional deps and has no build script.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true

# Supply-chain age gate (DAG-206). pnpm's default is 1440 (1 day); 4320 raises
# it to 3 days so it matches the Renovate `minimumReleaseAge` carried by
# local>caracal-lynx/.github:renovate-config-pnpm. Without this the two gates
# disagree: Renovate age-gates the update it *proposes*, but a rebase re-resolves
# the lockfile to newest-in-range ungated, so a package published minutes ago can
# land in the lockfile (sluice #262 — astro 7.1.2, published ~1h before the run).
# Applies to resolution AND frozen-lockfile verification, transitive deps
# included. Use `minimumReleaseAgeExclude` for urgent security patches.
minimumReleaseAge: 4320
