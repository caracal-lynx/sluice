# pnpm workspace. The repo root (@caracal-lynx/sluice) is the published
# package; docs-site is the Astro docs build. One pnpm-lock.yaml covers both.
#
# Settings live here (not package.json) since pnpm 11: the `pnpm` field in
# package.json is no longer read — `overrides` and build-script allowlisting
# moved to this file. See https://pnpm.io/settings. Only the workspace-root
# file is honoured, so docs-site's `devalue` override lives here too.
packages:
  - 'docs-site'

# Transitive-vuln pins (see CLAUDE.md for the advisory behind each). Renovate
# does not manage these — drop each when its parent ships a patched release.
overrides:
  tmp: '>=0.2.7'
  devalue: '>=5.8.1'
  uuid: '>=11.1.1'
  esbuild: '>=0.28.1'

# Build-script allowlist (pnpm 11's `allowBuilds`, formerly
# `onlyBuiltDependencies`). pnpm does not run dependency build scripts unless
# listed here. `@duckdb/node-api` is deliberately absent — it ships prebuilt
# binaries as optional deps and has no build script.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
